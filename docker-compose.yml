services:
 
  # Backend (NestJS)
  backend:
    image: node:18-alpine
    container_name: filmtdf_backend
    working_dir: /app
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app  
    # Regenerar cliente Prisma al arrancar para que reconozca schema actual (ej. redes sociales)
    command: sh -c "npx prisma generate && npm run start:dev"
    ports:
      - "3000:3000"
    
#  Frontend (Next.js) — bookworm-slim para que lightningcss (Tailwind/PostCSS) tenga el binario correcto
  frontend:
    image: node:20-bookworm-slim
    container_name: filmtdf_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - NODE_OPTIONS=--max-old-space-size=4096
    # El volumen frontend_node_modules conserva un .package-lock.json oculto: si queda
    # viejo, `npm install` dice "up to date" y no instala deps nuevas (p. ej. inkjs).
    command: sh -c "rm -f node_modules/.package-lock.json && npm install --legacy-peer-deps && npm run dev -- --webpack"
    ports:
      - "3001:3000" 

volumes:
  postgres_data:
  frontend_node_modules: